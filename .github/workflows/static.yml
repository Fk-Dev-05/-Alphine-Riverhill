name: Deploy Hertzsoft

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Prepare website
        run: |
          mkdir _site
          cp -R "Hertzsoft/." "_site/"

          cat > "_site/index.html" <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta http-equiv="refresh" content="0; url=html%20pages/index.html">
            <title>Alpine Riverhill</title>
          </head>
          <body>
            <p>Loading Alpine Riverhill...</p>
          </body>
          </html>
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

      - id: deployment
        uses: actions/deploy-pages@v4
